<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343945"/>
      <stop offset="1" stop-color="#101217"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.58" r="0.52">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="236" y1="250" x2="788" y2="500">
      <stop offset="0" stop-color="#7ab4ff"/>
      <stop offset="1" stop-color="#2d63e6"/>
    </linearGradient>
    <linearGradient id="green" gradientUnits="userSpaceOnUse" x1="772" y1="474" x2="304" y2="772">
      <stop offset="0" stop-color="#6fe2a4"/>
      <stop offset="1" stop-color="#1f9d61"/>
    </linearGradient>
    <linearGradient id="orange" gradientUnits="userSpaceOnUse" x1="300" y1="760" x2="760" y2="790">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#ff7417"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1a8"/>
      <stop offset="1" stop-color="#ffb04a"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="lamp" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- body: a dark graphite squircle -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- a lit window under the roof -->
  <rect x="452" y="398" width="120" height="104" rx="22" fill="#ffb04a" opacity="0.55" filter="url(#lamp)"/>
  <rect x="452" y="398" width="120" height="104" rx="22" fill="url(#window)"/>
  <path d="M512 398 v104 M452 450 h120" stroke="#2a2e38" stroke-opacity="0.55" stroke-width="10"/>

  <!-- the Z: roof (blue), diagonal (green), floor (orange) -->
  <g filter="url(#lift)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="88">
    <path d="M772 474 L304 772" stroke="url(#green)"/>
    <path d="M300 772 H736" stroke="url(#orange)"/>
    <path d="M236 470 L512 262 L788 470" stroke="url(#blue)"/>
  </g>
  <!-- glass sheen along the top of the strokes -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.35" stroke-width="10">
    <path d="M262 432 L512 244 L762 432"/>
    <path d="M340 744 H718"/>
  </g>
</svg>
