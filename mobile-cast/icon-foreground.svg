<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><g transform="translate(512 512) scale(0.78) translate(-512 -512)">
  <!-- Zazabor Link icon, in the Zazabor Home family. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343945"/>
      <stop offset="1" stop-color="#101217"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.58" r="0.52">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="236" y1="250" x2="788" y2="500">
      <stop offset="0" stop-color="#7ab4ff"/>
      <stop offset="1" stop-color="#2d63e6"/>
    </linearGradient>
    <linearGradient id="green" gradientUnits="userSpaceOnUse" x1="772" y1="474" x2="304" y2="772">
      <stop offset="0" stop-color="#6fe2a4"/>
      <stop offset="1" stop-color="#1f9d61"/>
    </linearGradient>
    <linearGradient id="orange" gradientUnits="userSpaceOnUse" x1="300" y1="760" x2="760" y2="790">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#ff7417"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1a8"/>
      <stop offset="1" stop-color="#ffb04a"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="lamp" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

    <!-- a phone (blue) linked to the home's Z-roof by a green arc, with an orange signal -->
  <g filter="url(#lift)">
    <rect x="300" y="250" width="270" height="500" rx="58" fill="url(#blue)"/>
    <rect x="326" y="300" width="218" height="380" rx="26" fill="#0f1218" fill-opacity="0.82"/>
    <rect x="404" y="270" width="62" height="12" rx="6" fill="#0f1218" fill-opacity="0.6"/>
    <rect x="352" y="334" width="140" height="22" rx="11" fill="url(#window)"/>
    <rect x="352" y="378" width="166" height="18" rx="9" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="352" y="414" width="120" height="18" rx="9" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="352" y="590" width="166" height="56" rx="16" fill="url(#green)"/>
  </g>
  <g fill="none" stroke-linecap="round" filter="url(#lift)">
    <path d="M600 430 a150 150 0 0 1 0 170" stroke="url(#green)" stroke-width="44"/>
    <path d="M664 360 a250 250 0 0 1 0 310" stroke="url(#orange)" stroke-width="44"/>
  </g>
  <path d="M340 268 h150" stroke="#ffffff" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
</g></svg>
