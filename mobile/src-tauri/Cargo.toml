[package]
name = "zazabor-wallet"
version = "0.1.0"
description = "Zazabor Wallet for Android"
edition = "2021"

# The phone app builds on its own: the desktop crate's libraries (GStreamer, PDFium, pty…) don't
# build for Android. The ledger is the desktop's `src-tauri/src/wallet`, compiled in by path.
[workspace]

[lib]
name = "zazabor_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
ironcalc = "0.9.1"
libc = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ring = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
tauri-plugin-barcode-scanner = "2"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
opt-level = "s"
