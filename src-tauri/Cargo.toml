[package]
name = "corepro"
version = "0.1.0"
description = "Files, photos and video in one app"
edition = "2021"

[lib]
name = "corepro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
walkdir = "2"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
url = "2"
argon2 = { version = "0.5", features = ["std"] }
gstreamer = "0.21"
libc = "0.2"
gio = "0.18"
notify = "8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.5"
lzma-rs = "0.3"
mime_guess = "2"
portable-pty = "0.9.0"
# Wallet: the ledger is a SQLite database (docs/plans/money.md).
rusqlite = { version = "0.41", features = ["bundled"] }
# Office → Sheets: reads and writes .xlsx; the page edits the same model through @ironcalc/wasm.
ironcalc = "0.9.1"
# Office → PDF: annotations, page content, encryption, redaction and compression (docs/plans/pdf.md).
lopdf = { version = "=0.46.0", default-features = false }
webp = { version = "0.3.1", default-features = false }
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
# Clipboard history (Win+V): GTK's clipboard and XTest's Ctrl+V. Both already come with Tauri.
gtk = "0.18"
x11-dl = "2.21"

# Image decoding is unusably slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
