[package]
name = "sliderpro"
version = "0.1.0"
description = "A Picasa-style photo viewer with deep zoom and cinematic slideshows"
edition = "2021"

[lib]
name = "sliderpro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
walkdir = "2"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
url = "2"
argon2 = { version = "0.5", features = ["std"] }
gstreamer = "0.21"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }

# Image decoding is unusably slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
