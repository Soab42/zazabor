<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Meeting</title>
<link rel="stylesheet" href="/assets/room.css">
</head>
<body>

<main id="loading" class="screen center"><div class="spinner"></div></main>

<!-- Stage 1: pre-join -->
<main id="prejoin" class="screen center" hidden>
  <div class="card">
    <div class="preview">
      <video id="pv" autoplay playsinline muted></video>
      <div id="pvAvatar" class="avatar"><span id="pvInitial">?</span></div>
      <div class="preview-bar">
        <button id="pvMic" class="round" type="button" title="Microphone" aria-label="Microphone"><span class="ic" data-i="mic" data-off="micOff"></span></button>
        <button id="pvCam" class="round" type="button" title="Camera" aria-label="Camera"><span class="ic" data-i="cam" data-off="camOff"></span></button>
      </div>
    </div>
    <div class="form">
      <h1 id="pjTitle">Meeting</h1>
      <p id="pjSub" class="muted"></p>
      <div id="recBanner" class="banner" hidden><span class="dot"></span>This meeting is recorded by the host.</div>
      <label class="field"><span>Your name</span><input id="pjName" type="text" maxlength="40" autocomplete="name" placeholder="Your name"></label>
      <label class="field" id="micPick" hidden><span>Microphone</span><select id="micSel"></select></label>
      <label class="field" id="camPick" hidden><span>Camera</span><select id="camSel"></select></label>
      <p id="mediaNote" class="note" hidden></p>
      <button id="joinBtn" class="primary" type="button">Join</button>
    </div>
  </div>
</main>

<!-- Stage 2: lobby -->
<main id="lobby" class="screen center" hidden>
  <div class="card narrow">
    <div class="spinner"></div>
    <h1>Waiting for the host to let you in…</h1>
    <p class="muted">You will join as soon as the host admits you.</p>
    <button id="lobbyLeave" class="ghost" type="button">Cancel</button>
  </div>
</main>

<!-- The meeting ended / you left / you were refused -->
<main id="over" class="screen center" hidden>
  <div class="card narrow">
    <h1 id="overTitle">Meeting ended</h1>
    <p id="overText" class="muted"></p>
    <button id="rejoinBtn" class="primary" type="button">Join again</button>
  </div>
</main>

<!-- Stage 3: the room -->
<main id="room" class="screen" hidden>
  <header id="topbar" class="glass bar">
    <div class="top-left"><strong id="roomTitle"></strong><span id="clock" class="muted"></span></div>
    <div class="top-right">
      <span id="recPill" class="pill rec" hidden><span class="dot"></span>REC</span>
      <button id="recToggle" class="chip" type="button" hidden>Pause recording</button>
      <span id="count" class="pill"><span class="ic" data-i="users"></span><b id="countN">1</b></span>
    </div>
  </header>

  <div id="body">
  <div id="stageWrap">
    <div id="main" class="main"></div>
    <div id="strip" class="strip" hidden></div>
  </div>

  <aside id="panel" class="glass" hidden>
    <div class="panel-head">
      <div class="tabs">
        <button id="tabChat" type="button" class="tab active">Chat</button>
        <button id="tabPeople" type="button" class="tab">People</button>
      </div>
      <button id="panelClose" class="round small" type="button" aria-label="Close"><span class="ic" data-i="close"></span></button>
    </div>
    <section id="chatPane" class="pane">
      <div id="chatLog" class="log"></div>
      <form id="chatForm" autocomplete="off">
        <input id="chatInput" type="text" maxlength="2000" placeholder="Message everyone">
        <button type="submit" class="primary small">Send</button>
      </form>
    </section>
    <section id="peoplePane" class="pane" hidden>
      <div id="waitBox" hidden>
        <div class="section-head"><span>Waiting to join</span><button id="admitAll" class="chip" type="button">Admit all</button></div>
        <ul id="waitList" class="people"></ul>
      </div>
      <div class="section-head"><span>In the meeting</span></div>
      <ul id="peopleList" class="people"></ul>
    </section>
  </aside>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="knocks"></div>

  <footer id="bottombar" class="glass bar">
    <button id="bMic" class="round" type="button" title="Microphone" aria-label="Microphone"><span class="ic" data-i="mic" data-off="micOff"></span></button>
    <button id="bCam" class="round" type="button" title="Camera" aria-label="Camera"><span class="ic" data-i="cam" data-off="camOff"></span></button>
    <button id="bShare" class="round" type="button" title="Share your screen" aria-label="Share your screen"><span class="ic" data-i="share"></span></button>
    <button id="bHand" class="round" type="button" title="Raise hand" aria-label="Raise hand"><span class="ic" data-i="hand"></span></button>
    <div class="react-wrap">
      <button id="bReact" class="round" type="button" title="Reactions" aria-label="Reactions"><span class="ic" data-i="smile"></span></button>
      <div id="reactMenu" class="glass menu" hidden>
        <button type="button" data-e="👍">👍</button><button type="button" data-e="❤️">❤️</button><button type="button" data-e="😂">😂</button><button type="button" data-e="🎉">🎉</button><button type="button" data-e="👏">👏</button>
      </div>
    </div>
    <button id="bChat" class="round" type="button" title="Chat" aria-label="Chat"><span class="ic" data-i="chat"></span><span id="chatBadge" class="badge" hidden>0</span></button>
    <button id="bPeople" class="round" type="button" title="People" aria-label="People"><span class="ic" data-i="users"></span><span id="peopleBadge" class="badge" hidden>0</span></button>
    <button id="bEnd" class="danger-wide" type="button" hidden>End for everyone</button>
    <button id="bLeave" class="round danger" type="button" title="Leave" aria-label="Leave"><span class="ic" data-i="hangup"></span></button>
  </footer>
</main>

<script src="/assets/room.js"></script>
</body>
</html>
